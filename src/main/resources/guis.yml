guis:
  background_buttons: true
  background_1:
    display_name: "&8x"
    material: "BLACK_STAINED_GLASS_PANE"
  background_2:
    display_name: "&8x"
    material: "GRAY_STAINED_GLASS_PANE"
  free: "&eFree"
  yes_text: "&aYes"
  no_text: "&cNo"
  back:
    display_name: "&eBack"
    material: "OAK_DOOR"
  previous_page:
    display_name: "&ePrevious Page"
    material: "FEATHER"
  next_page:
    display_name: "&eNext Page"
    material: "COMPASS"
  enabled:
    display_name: "&aEnabled"
  disabled:
    display_name: "&cDisabled"

  scroll_button:
    directions:
      LEFT: "Left"
      RIGHT: "Right"
      DOWN: "Down"
      UP: "Up"

  # Claim Menu - When /nclaim is typed, it is the menu with operations such as buy claim
  claim_menu:
    title: "Claim Menu"
    enter_a_name_title: "Claim name (empty = default)"
    admin:
      display_name: "&6Admin Menu"
      material: "COMMAND_BLOCK"
    buy_claim:
      display_name: "&6Buy a Claim"
      material: "EMERALD"
      lore:
        - ""
        - "&fPurchase a new claim"
        - "&7Cost: &e${price}"
        - ""
        - "&eClick to purchase"
    manage_claims:
      display_name: "&6Manage Claims"
      material: "CHEST"
      lore:
        - ""
        - "&fManage your claims:"
        - "&7• &fView all claims"
        - "&7• &fModify settings"
        - "&7• &fManage members"
        - ""
        - "&eClick to manage"

  # Claim List Menu - The menu that opens after typing /nclaim and clicking the 'Manage Claims' button.
  claim_list_menu:
    title: "Claim List"
    list_type:
      display_name: "&6List Type"
      material: "PAPER"
      all: "All"
      player: "Player"
      coop: "Co-op"
    own_claims:
      display_name: "&6Claim: &e{display_slug}"
      material: "GRASS_BLOCK"
      lore:
        - ""
        - "&fWorld: &e{world}"
        - "&fLocation: &e{coordinates}"
        - "&fOwner: &e{owner}"
        - ""
        - "&7Click to manage"
    on_sale_lore:
      - ""
      - "&6&l[ FOR SALE ]"
      - "&fPrice: &e${price}"
    coop_claims:
      display_name: "&6Co-op Claim: &e{claim_id}"
      material: "OAK_SIGN"
      lore:
        - ""
        - "&fWorld: &e{world}"
        - "&fLocation: &e{coordinates}"
        - "&fOwner: &e{owner}"
        - ""
        - "&7What you can do here depends on"
        - "&7the permissions the owner gave you."
        - ""
        - "&eClick to open"

  # Claim Management Menu - The menu that opens when interacting with the claim block.
  claim_management_menu:
    title: "Manage Claim"
    enter_a_price_title: "Enter a price"
    enter_a_name_title: "New name (empty = reset)"
    # Claim summary (top left), shown with the claim block's material. Click to recalculate the value.
    # {name} {owner} {world} {coordinates} {size} {max_size} {coops} {value} {time_left} {sale}
    # {value_section} expands to info.value_section below.
    info:
      display_name: "&6{name}"
      for_sale: "&aFor sale &7(&e${price}&7)"
      not_for_sale: "&7Not for sale"
      valuable_block_format: "&f{block} &8» &e+{value}"
      lore:
        - ""
        - "&fOwner: &e{owner}"
        - "&fLocation: &7{world}, {coordinates}"
        - "&fSize: &e{size}&7/{max_size} chunks"
        - "&fCo-op members: &e{coops}"
        - "&fTime left: {time_left}"
        - "&fSale: {sale}"
        - "{value_section}"
      # Replaces {value_section}; left out when block_levels.yml lists no blocks.
      # A line with {valuable_blocks} repeats for the most valuable blocks (values come from block_levels.yml).
      value_section:
        - ""
        - "&fClaim value: &e{value}"
        - "&7Valuable blocks placed in your claim"
        - "&7raise its value, for example:"
        - "  &7• {valuable_blocks}"
        - ""
        - "&eClick &7- &fRecalculate the value"
    rename:
      display_name: "&6Rename Claim"
      material: "NAME_TAG"
      lore:
        - ""
        - "&fCurrent name: &e{name}"
        - "&7Shown on the hologram and in lists."
        - "&7Leave the name empty to reset it."
        - ""
        - "&eClick to rename"
    delete:
      display_name: "&cDelete Claim"
      material: "TNT"
      lore:
        - ""
        - "&cWarning: &fThis will permanently delete"
        - "&fyour claim without any refund"
        - ""
        - "&eClick to proceed"
    expand:
      display_name: "&6Expand Claim"
      material: "GRASS_BLOCK"
      lore:
        - ""
        - "&fAdd neighbouring chunks to your claim"
        - "&fSize: &e{size}&7/{max_size} chunks"
        - "&fNext chunk: &e{next_price}"
        - ""
        - "&eClick to open the chunk map"
      max_reached: "&cmaximum size reached"
    time:
      display_name: "&6Manage Expiration"
      material: "CLOCK"
      lore:
        - ""
        - "&fTime left: {time_left}"
        - "&7When the time runs out the claim"
        - "&7is deleted. Extend it in time!"
        - ""
        - "&eClick to extend"
    coop:
      display_name: "&6Manage Co-ops"
      material: "TURTLE_HELMET"
      lore:
        - ""
        - "&fMembers: &e{coops}"
        - "&7Let friends build with you and"
        - "&7choose what each of them may do."
        - ""
        - "&eClick to manage"
    setting:
      display_name: "&6Claim Settings"
      material: "END_CRYSTAL"
      lore:
        - ""
        - "&fPvP, explosions, mob spawning,"
        - "&ffire spread and more."
        - ""
        - "&eClick to configure"
    claim_block:
      display_name: "&6Claim Block"
      material: "SHULKER_BOX"
      lore:
        - ""
        - "&fCurrent block: &e{block}"
        - "&7• &fChange its look"
        - "&7• &fTeleport to your claim"
        - "&7• &fMove it inside the main chunk"
        - ""
        - "&eClick to manage"
    sell:
      display_name: "&6Sell The Claim"
      material: "GOLD_INGOT"
      # Shown while the claim is not for sale
      lore:
        - ""
        - "&fStatus: &7Not for sale"
        - "&7Set a price; anyone can then buy it"
        - "&7from the claim block. The money goes"
        - "&7to you and the buyer becomes the owner."
        - ""
        - "&eClick to set a price"
      # Shown while the claim is for sale
      lore_for_sale:
        - ""
        - "&fStatus: &aFor sale &7(&e${price}&7)"
        - ""
        - "&eLeft Click &7- &fChange the price"
        - "&eRight Click &7- &fStop selling"
    borders:
      display_name: "&6Show Claim Borders"
      material: "ENDER_EYE"
      status_on: "&aShown"
      status_off: "&cHidden"
      lore:
        - ""
        - "&fShows nearby claim borders as"
        - "&fcolored walls, only for you."
        - "&a■ &fyours  &b■ &fco-op  &c■ &fothers"
        - "&7Same as &e/nclaim border"
        - ""
        - "&fStatus: {status}"
        - ""
        - "&eClick to toggle"

  # Claim Expand Menu - The menu that opens after interacting with the claim block and clicking the 'Expand Claim' button.
  claim_expand_menu:
    title: "Expand Claim"
    scroll_button:
      display_name: "&fScroll {direction}"
    center:
      display_name: "&6Center Chunk"
      lore:
        - ""
        - "&fThis is your claim's center chunk"
        - "&7The claim block is in this chunk."
        - ""
        - "&eClick &7- &fBack to claim management"
    expand:
      display_name: "&6Expand Claim"
      material: "BROWN_WOOL"
      lore:
        - ""
        - "&fAdd this chunk to your claim"
        - "&7Cost: &e${price}"
        - ""
        - "&eLeft Click &7- &fPurchase"
        - "&eRight Click &7- &fShow its borders"
    claimed:
      display_name: "&aClaimed Chunk"
      material: "GREEN_WOOL"
      lore:
        - ""
        - "&fThis chunk is part of your claim"
        - ""
        - "&eRight Click &7- &fUnclaim this chunk"
    not_adjacent:
      display_name: "&cInvalid Chunk"
      material: "BLACK_WOOL"
      lore:
        - ""
        - "&fYou can only claim chunks next to"
        - "&fyour claim (not diagonally)."
    claimed_another_player:
      display_name: "&cClaimed by Another Player"
      material: "RED_WOOL"
      lore:
        - ""
        - "&fThis chunk belongs to someone else"
        - "&7It cannot be added to your claim."

  # Claim Time Management Menu - The menu that opens after interacting with the claim block and clicking the 'Manage Expiration' button.
  claim_time_management_menu:
    title: "Manage Time"
    claim_info:
      display_name: "&6Duration Info"
      material: "GLOW_ITEM_FRAME"
      lore:
        - ""
        - "&fTime Remaining: &e{time_left}"
        - "&fExpires: &e{expires_at}"
        - ""
        - "&7When the time runs out the claim is"
        - "&7deleted and your builds lose protection."
    # {d} {h} {m} = time to add, {price} = total cost incl. tax, {tax} = tax part
    confirm:
      display_name: "&aExtend Claim"
      material: "BLUE_ICE"
      lore:
        - ""
        - "&fTime to add:"
        - "&7• &e{d} &fdays"
        - "&7• &e{h} &fhours"
        - "&7• &e{m} &fminutes"
        - ""
        - "&fCost: &e{price} &7(tax: {tax})"
        - ""
        - "&eClick to pay and extend"
    select_time_unit:
      display_name: "&6Select Time Unit"
      material: "CHAIN"
      lore:
        - ""
        - "&f• {days_status}"
        - "&f• {hours_status}"
        - "&f• {minutes_status}"
        - ""
        - "&eClick to switch the unit"
    days_status: "Days" # You cannot use color codes.
    hours_status: "Hours"
    minutes_status: "Minutes"
    add_one:
      display_name: "&a+1 {unit}"
      material: "LIME_CONCRETE"
      lore:
        - ""
        - "&eClick to add"
    add_six:
      display_name: "&a+6 {unit}"
      material: "GREEN_CONCRETE"
      lore:
        - ""
        - "&eClick to add"
    subtract_one:
      display_name: "&c-1 {unit}"
      material: "PINK_CONCRETE"
      lore:
        - ""
        - "&eClick to remove"
    subtract_six:
      display_name: "&c-6 {unit}"
      material: "RED_CONCRETE"
      lore:
        - ""
        - "&eClick to remove"

  claim_manage_coop_menu:
    title: "Co-op Members"
    offline: "&7(Offline)"
    add_coop:
      display_name: "&aAdd Member"
      material: "NETHER_STAR"
      lore:
        - ""
        - "&fLet a friend build in your claim."
        - "&7You choose what they may do after."
        - ""
        - "&eClick and type a player name"
    search_title: "Enter a player name"
    empty_slot:
      display_name: "&fEmpty Slot"
      material: "WHITE_STAINED_GLASS_PANE"
      lore:
        - ""
        - "&eClick to add member"
    locked_slot:
      display_name: "&cLocked Slot"
      material: "RED_STAINED_GLASS_PANE"
      lore:
        - ""
        - "&fYour co-op limit is reached."
        - "&7More slots come with a higher rank."
    coop_info:
      display_name: "&e{player}"
      lore:
        - ""
        - "&fJoined: &7{date}"
        - ""
        - "&eClick to edit"
      admin_lore:
        - "&fPermissions: &a{yes}&7/&c{no}"
        - ""
        - "&eClick to modify"

  manage_coop_player_permission_menu:
