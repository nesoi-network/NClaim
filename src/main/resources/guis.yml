    info:
      display_name: "&6About Claim Settings"
      material: "BOOK"
      lore:
        - ""
        - "&fThese rules apply to the whole claim,"
        - "&ffor everyone inside it."
        - "&7What each co-op member may do is set"
        - "&7in the co-op menu instead."
    reset:
      display_name: "&cReset to Defaults"
      material: "WATER_BUCKET"
      lore:
        - ""
        - "&fPuts every setting back to the"
        - "&fserver's default."
        - ""
        - "&eClick to reset (asks first)"

  claim_block_management_menu:
    title: "Claim Block Management"
    enter_a_price_title: "Price for everyone"
    # Admin only: empty block slots. Hold a block in your hand and click.
    add_block:
      display_name: "&fAdd a Block Type"
      material: "WHITE_STAINED_GLASS_PANE"
      lore:
        - ""
        - "&fChoose a block, its name and price,"
        - "&ffor every claim or only this one."
        - ""
        - "&eClick to open"
    teleport:
      display_name: "&6Teleport to Claim"
      material: "ENDER_PEARL"
      lore:
        - ""
        - "&fTeleports you to claim location"
        - ""
        - "&eClick to teleport"
    move_claim_block:
      display_name: "&6Move the Claim Block"
      material: "SHULKER_BOX"
      lore:
        - ""
        - "&fMoves the claim block to where you stand"
        - "&7You must be inside the claim's main chunk"
        - "&7and stand on an empty spot."
        - ""
        - "&eClick to proceed"
    # Claim block types listed in this menu (blocks come from claim_blocks.yml).
    # {block} = block name, {cost} = price, {balance} = your balance, {need_balance} = min(balance, price).
    # A lore set in claim_blocks.yml replaces the "locked" lore below.
    block_item:
      display_name: "&e{block}"
      enough_balance_color: "&a"
      not_enough_balance_color: "&c"
      selected:
        lore:
          - ""
          - "&a✔ Currently in use"
      owned:
        lore:
          - ""
          - "&fYou already own this block"
          - ""
          - "&eClick to use it"
      locked:
        lore:
          - ""
          - "&fPrice: &6${cost}"
          - "&fYour balance: {balance}"
          - ""
          - "&eClick to buy and use it"
      no_permission:
        lore:
          - ""
          - "&cYou don't have permission for this block"
      # Added under the lore of a block an admin gave only to this claim
      claim_only_lore:
        - "&7Only available for this claim"
      # Added under every block when the menu is opened from the admin menu
      admin_lore:
        - ""
        - "&8Admin:"
        - "&eRight Click &7- &fChange price &7(${cost})"
        - "&eShift + Right Click &7- &fRemove for every claim"
      admin_claim_only_lore:
        - ""
        - "&8Admin:"
        - "&eRight Click &7- &fChange price &7(${cost})"
        - "&eShift + Right Click &7- &fRemove from this claim"

  # Admin editor for a new claim block type (opened from an empty slot of the claim block menu)
  claim_block_add_menu:
    title: "Add Claim Block"
    enter_a_name_title: "Block name"
    enter_a_price_title: "Price"
    block:
      empty:
        display_name: "&6Choose a Block"
        material: "BARRIER"
        lore:
          - ""
          - "&fNo block selected yet."
          - ""
          - "&eClick to choose"
      selected:
        display_name: "&6Block: &e{block}"
        lore:
          - ""
          - "&eClick to choose another"
    name:
      display_name: "&6Name: &e{name}"
      material: "NAME_TAG"
      lore:
        - ""
        - "&fShown in the claim block menu."
        - "&7Used for every-claim blocks only."
        - ""
        - "&eClick to change"
    price:
      display_name: "&6Price: &e${price}"
      material: "GOLD_INGOT"
      lore:
        - ""
        - "&fWhat a player pays once to"
        - "&funlock this block for a claim."
        - ""
        - "&eClick to change"
    scope:
      everyone:
        display_name: "&6For: &aEvery claim"
        material: "ENDER_EYE"
        lore:
          - ""
          - "&fSaved to claim_blocks.yml and"
          - "&fshown in every claim's menu."
          - ""
          - "&eClick to switch to this claim only"
      this_claim:
        display_name: "&6For: &bThis claim only"
        material: "ENDER_PEARL"
        lore:
          - ""
          - "&fOnly this claim can buy the block,"
          - "&fat the price you set (0 = free)."
          - ""
          - "&eClick to switch to every claim"
    save:
      display_name: "&aAdd Block"
      material: "LIME_CONCRETE"
      lore:
        - ""
        - "&fBlock: &e{block}"
        - "&fPrice: &e{price}"
        - "&f{scope}"
        - ""
        - "&eClick to save"

