  admin_menu:
    all_claims_menu:
      # Server wide numbers at the top. {claims} {owners} {chunks} {for_sale}
      stats:
        display_name: "&6Server Claims"
        material: "BOOK"
        lore:
          - ""
          - "&fClaims: &e{claims}"
          - "&fOwners: &e{owners}"
