# NClaim Configuration File

# General Settings
check_for_updates: true  # Enable/disable update checker
lang_file: "en-US"      # Language file to use (en-US, tr-TR)
prefix: "&8[<#fa8443>NClaim&8]&r"  # Plugin prefix in chat messages

# How prices, balances and claim values are shown (menus, holograms, placeholders)
#   compact: 950, 1.5k, 20.3k, 1.25M
#   full:    950, 1,500, 20,300, 1,250,000
# At most two decimals are shown in both styles.
number_format:
  style: compact
  suffixes: ["k", "M", "B", "T"]

# World Restrictions
# Configure which worlds and WorldGuard regions are restricted from claiming
# Empty by default, so claiming works out of the box. Example:
# blacklisted_worlds:
#   - spawn   # spawn world
#   - pvp     # PvP arena world
# Also manageable in-game: /nclaim admin add|remove blacklisted_world <world>
blacklisted_worlds: []

# Example:
# blacklisted_regions:
#   - spawnarea  # spawn protection area
blacklisted_regions: []

claim_distance:
  chunks: 1 # How many chunks away from nearby claims can a player create a claim.
  bypass_coop_players: true # If true, allows players to claim chunks adjacent to claims owned by their co-op teammates, ignoring the standard distance rule.

# Hologram Settings
# The hologram above every claim block. Apply changes with /nclaim admin reload.
hologram_settings:
  # One entry per line, top to bottom. Leave the list empty to turn holograms off.
  # Built-in lines use the texts from your language file (lang/<language>.yml > hologram):
  #   title, owner, time_left, coop_count, total_size, value, edit
  # Anything else is shown as written. You can use:
  #   {display_name} {owner} {time_left} {coop_count} {total_size} {value} {claim_id}
  #   colour codes (&a, <#FF5733>, &#FF5733) and PlaceholderAPI placeholders (the claim owner is the player)
  # Use "" for an empty line.
  lines:
    - title
    - owner
    - time_left
    - coop_count
    - total_size
    - ""
    - edit
  height: 1.25           # Blocks above the claim block
  scale: 1.0             # Text size, 1.0 = normal
  background: "default"  # "default", "none", or a colour like "#000000" or "#80000000" (AARRGGBB, with transparency)
  shadow: true           # Text shadow
  # Colour of {time_left}. Conditions are checked from top to bottom, the first match is used.
  # Units: day, hour, minute. Colours: "&a", "<#FF0000>" ...
  time_left_thresholds:
    - threshold: "day >= 2"
      color: "&a"
    - threshold: "day >= 1"
      color: "&e"
    - threshold: "day < 1"
      color: "&c"

# Claim Settings
claim_settings:
  max_count: 3        # Maximum number of claims per player
  buy_price: 1500     # Cost to create a new claim
  expand_price: 2000  # Cost to expand an existing claim by one chunk

  default_claim_block_type: OBSIDIAN  # Block type to be used as the marker for new claims (e.g., OBSIDIAN, GOLD_BLOCK, DIAMOND_BLOCK)

  # TIERED PRICING SYSTEM (Maximum 117 chunks)
  tiered_pricing:
    enable: false  # true = Tiered system ON, false = Old system (fixed price)

    # HOW IT WORKS:
    # Your claim starts with 1 chunk (main chunk)
    # You can expand up to 117 chunks total
    # Price increases with each tier

    tiers:
      # FIRST 5 CHUNKS FREE (2nd-6th chunks)
      tier1:
        min: 2          # Starting from the 2nd chunk
        max: 6          # Up to 6th chunk
        price: 0        # Free
        # Total free: 5 chunks

      # EASY LEVEL (7th-15th chunks)
      tier2:
        min: 7          # Starting from the 7th chunk
        max: 15         # Up to 15th chunk
        price: 500      # 500 coins per chunk
        # Total: 9 chunks x 500 = 4,500 coins

      # MEDIUM LEVEL (16th-25th chunks)
      tier3:
        min: 16         # Starting from the 16th chunk
        max: 25         # Up to 25th chunk
        price: 1000     # 1000 coins per chunk
        # Total: 10 chunks x 1000 = 10,000 coins

      # HARD LEVEL (26th-35th chunks)
      tier4:
        min: 26         # Starting from the 26th chunk
        max: 35         # Up to 35th chunk
        price: 2500     # 2500 coins per chunk
        # Total: 10 chunks x 2500 = 25,000 coins

  max_coop_count:     # Maximum number of co-op players per claim
    default: 3
    vip: 5
  # Permissions will be need like this "nclaim.maxcoop.default"
  expiry_days: 7      # Days until an inactive claim expires
  last_claim_time: 5  # The time (in minutes) to wait before making a new claim after buying a claim
  sell: true # Enable or disable selling claims
  max_chunks: 117     # Maximum chunks per claim, including the main chunk (1-117)
  default_name: ""    # Name for new claims when none is given. {player} = owner name. Empty = use the claim id
  # Forbidden claim names live in plugins/NClaim/name_blacklist.txt (one word per line, ships with
  # a list of common slurs and insults). Entries here are added on top of that file.
  # Same rules: case-insensitive, look-alikes count (1=i, 3=e, 0=o, 4/@=a, $=s), words of 5+ letters
  # match at a word start (also split with dots or spaces), shorter words only as a whole word, 'regex:...' for patterns.
  name_blacklist: []

# Auto-Save Configuration
auto_save: 30  # How often to save data (in minutes)

# Time Extension Settings
time_extension:
  price_per_minute: 25.0
  price_per_hour: 1500.0
  price_per_day: 5000.0
  tax_rate: 0.1

webhook_settings:
  enabled: false # Enable or disable the webhook system
  url: "https://discord.com/api/webhooks/WEBHOOK_ID/WEBHOOK_TOKEN" # Discord webhook URL
  use_embed: true # Send it as embed (true) or plain text (false)
  content: |
    Claim of %player% in %world% at %x%, %y%, %z% has expired and was deleted!
  embed:
    title: "" # Embed title
    description: | # Embed description (supports placeholders)
      > # ⏰ Claim Time Expired / Deleted!
      > **Player**: `%player%`
      > **World**: `%world%`
      > **Coordinates**: `%x%, %y%, %z%`
    color: "#FF0000" # Embed color (hex format)
    footer: "NClaim Advanced Chunk-Based Claim System" # Text shown in the embed footer
    timestamp: true # Add the current timestamp to the embed
    image: "" # Image URL to display in the embed (optional)
    thumbnail: "" # Thumbnail image URL (optional)
  mention: "" # Mention a user or role (e.g., <@&ROLE_ID>, leave empty for none)

# Sound Settings
# Use the sound constant (BLOCK_NOTE_BLOCK_CHIME) or its key (block.note_block.chime). NONE disables a sound.
sounds:
  confirm: BLOCK_NOTE_BLOCK_CHIME
  fail: ENTITY_ENDERMAN_TELEPORT
  warn: BLOCK_NOTE_BLOCK_BASS
  value_increase: UI_BUTTON_CLICK
  value_decrease: UI_BUTTON_CLICK
  menu_refresh: BLOCK_PISTON_CONTRACT
  menu_back: ITEM_BUNDLE_DROP_CONTENTS
  menu_click: UI_BUTTON_CLICK
  search_open: UI_CARTOGRAPHY_TABLE_TAKE_RESULT
  menu_forward: BLOCK_ENCHANTMENT_TABLE_USE
  teleport: BLOCK_ENCHANTMENT_TABLE_USE
  claim_create: BLOCK_BEACON_ACTIVATE   # Played at the claim block when a claim is created
  claim_remove: ENTITY_GENERIC_EXPLODE  # Played at the claim block when a claim is removed or expires
  land_expand: ENTITY_PLAYER_LEVELUP    # Played to the player after buying a chunk
  land_unclaim: BLOCK_GRAVEL_BREAK      # Played to the player after unclaiming a chunk

# Database Configuration
# Chooses between MySQL and SQLite for data storage
database:
  enable: false  # Set to true to use database storage instead of YAML
  type: "mysql"  # Options: "mysql" or "sqlite"

  # SQLite Configuration
  sqlite:
    file: database.db  # Database file name

  # MySQL Configuration
  mysql:
    host: localhost
    port: 3306
    database: nclaim
    user: root
    password: ""       # Replace it with your database password
    maximum_pool_size: 10  # Maximum number of connections in the pool
    minimum_idle: 5        # Minimum number of idle connections
    idle_timeout: 300000   # Time (ms) before an idle connection is closed (default: 5 minutes)
    max_lifetime: 1800000  # Maximum lifetime (ms) of a connection (default: 30 minutes)
    connection_timeout: 30000  # Time (ms) to wait for a connection (default: 30 seconds)

# Do not modify this value
config_version: "@version@"
